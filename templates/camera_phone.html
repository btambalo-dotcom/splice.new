<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Câmera">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="{{ url_for('cam_manifest', token=token) }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<title>SPLICER Câmera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, system-ui, Roboto, sans-serif; overflow: hidden; }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background: linear-gradient(#000d, #0000); z-index: 5; }
  #dev { font-size: 19px; font-weight: 800; line-height: 1.15; word-break: break-word; }
  #map { font-size: 13px; color: #9ca3af; }
  #status { font-size: 12px; color: #fbbf24; margin-top: 2px; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111; }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(env(safe-area-inset-bottom) + 14px); background: linear-gradient(#0000, #000e 35%); z-index: 5; }
  #row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #shoot { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: #fff3; flex: none; }
  #shoot:active { background: #fff9; }
  #shoot:disabled { opacity: .35; }
  .side { width: 92px; display: flex; flex-direction: column; gap: 6px; }
  .btn { background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 10px; padding: 8px 6px; font-size: 12px; text-align: center; }
  .btn.g { background: #065f46; border-color: #10b981; }
  #fus { width: 100%; background: #111827; color: #fff; border: 1px solid #374151; border-radius: 10px; padding: 8px; font-size: 15px; text-align: center; }
  #thumbs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; min-height: 0; }
  .th { position: relative; flex: none; }
  .th img { height: 64px; border-radius: 6px; display: block; }
  .th span { position: absolute; left: 2px; bottom: 2px; font-size: 10px; background: #000b; padding: 1px 4px; border-radius: 4px; }
  #msg { font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  #none { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 4; background: #000c; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; transition: opacity .25s; }
  #file { display: none; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div id="flash"></div>
<div id="top">
  <div id="dev">Carregando…</div>
  <div id="map"></div>
  <div id="status">GPS: aguardando…</div>
</div>
<div id="none">
  <div>
    <div style="font-size:42px">📱</div>
    <div style="font-size:18px;font-weight:700;margin:8px 0">Nenhum dispositivo escolhido</div>
    <div style="color:#9ca3af;font-size:14px">No iPad/computador, abra o mapa e toque em <b>📷 Foto no celular</b> no pin. Esta tela muda sozinha.</div>
  </div>
</div>
<div id="bottom">
  <div id="thumbs"></div>
  <div id="msg"></div>
  <div id="row">
    <div class="side">
      <input id="fus" type="number" inputmode="numeric" placeholder="Fusões">
      <div class="btn" id="btn-native">📁 Câmera iPhone</div>
    </div>
    <button id="shoot" disabled aria-label="Tirar foto"></button>
    <div class="side">
      <div class="btn g" id="btn-launch" style="display:none;font-weight:700">🚀 Lançar</div>
      <div class="btn" id="btn-save" style="display:none">💾 Salvar na galeria</div>
      <div class="btn" id="btn-flip">🔄 Câmera</div>
    </div>
  </div>
</div>
<input type="file" id="file" accept="image/*" capture="environment">

<script>
(() => {
  const TOKEN = {{ token|tojson }};
  const BASE = '/cam/' + encodeURIComponent(TOKEN);
  const $ = (id) => document.getElementById(id);
  let target = null;           // {record_id, device, map}
  let pos = null;              // {lat, lng, acc}
  let addr = '';               // endereço do GPS
  let addrKey = '';
  let facing = 'environment';
  let stream = null;
  let lastBlob = null, lastName = '';

  // ---------- dispositivo escolhido (iPad manda, celular segue) ----------
  async function poll() {
    try {
      const r = await fetch(BASE + '/state', { cache: 'no-store' });
      const d = await r.json();
      if (!d.record_id) { target = null; showTarget(); return; }
      if (!target || target.record_id !== d.record_id) {
        target = d; showTarget();
        if (navigator.vibrate) navigator.vibrate(80);
        $('fus').value = '';
        say('Pronto para: ' + d.device, '#4ade80');
      } else { target = d; }
    } catch (e) { /* sem sinal: mantém o último */ }
  }
  function showTarget() {
    $('none').style.display = target ? 'none' : 'flex';
    $('dev').textContent = target ? target.device : '—';
    $('map').textContent = target ? ('MAP: ' + target.map + (target.n_photos != null ? ' · ' + target.n_photos + ' foto(s)' : '')) : '';
    $('shoot').disabled = !target;
  }
  setInterval(() => { if (!document.hidden) poll(); }, 2500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); startCam(); } else stopCam(); });

  // ---------- GPS + endereço ----------
  function startGps() {
    if (!navigator.geolocation) { $('status').textContent = 'GPS indisponível'; return; }
    navigator.geolocation.watchPosition((p) => {
      pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
      $('status').textContent = 'GPS ±' + Math.round(pos.acc) + ' m' + (addr ? ' · ' + addr : '');
      lookupAddr();
    }, (e) => { $('status').textContent = 'GPS: ' + (e.code === 1 ? 'permita a localização' : 'sem sinal'); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }
  const ABBR = [[/\bBoulevard\b/i,'Blvd'],[/\bDrive\b/i,'Dr'],[/\bRoad\b/i,'Rd'],[/\bAvenue\b/i,'Ave'],[/\bStreet\b/i,'St'],
                [/\bCircle\b/i,'Cir'],[/\bLane\b/i,'Ln'],[/\bCourt\b/i,'Ct'],[/\bParkway\b/i,'Pkwy'],[/\bHighway\b/i,'Hwy'],
                [/\bPlace\b/i,'Pl'],[/\bTerrace\b/i,'Ter'],[/\bTrail\b/i,'Trl']];
  const abbr = (s) => ABBR.reduce((a, [r, t]) => a.replace(r, t), s || '');
  let addrBusy = false;
  async function lookupAddr() {
    if (!pos || addrBusy) return;
    const key = pos.lat.toFixed(4) + ',' + pos.lng.toFixed(4);
    if (key === addrKey) return;
    addrBusy = true;
    try {
      let a = '';
      try {
        const r = await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&featureTypes=PointAddress,StreetAddress&location=' + pos.lng + ',' + pos.lat);
        const j = await r.json();
        const ad = j && j.address;
        if (ad && ad.Address) a = abbr(ad.Address) + ', ' + (ad.City || '') + ' ' + (ad.RegionAbbr || ad.Region || '') + ' ' + (ad.Postal || '');
      } catch (e) {}
      if (!a) {
        const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=' + pos.lat + '&lon=' + pos.lng);
        const j = await r.json(); const ad = j.address || {};
        const street = [ad.house_number, abbr(ad.road || '')].filter(Boolean).join(' ');
        const city = ad.city || ad.town || ad.village || ad.hamlet || '';
        const st = (ad['ISO3166-2-lvl4'] || '').split('-')[1] || ad.state || '';
        a = [street, [city, st, ad.postcode].filter(Boolean).join(' ')].filter(Boolean).join(', ');
      }
      if (a) { addr = a.replace(/\s+/g, ' ').trim(); addrKey = key; }
    } catch (e) {}
    addrBusy = false;
    if (pos) $('status').textContent = 'GPS ±' + Math.round(pos.acc) + ' m' + (addr ? ' · ' + addr : '');
  }

  // ---------- câmera ao vivo ----------
  async function startCam() {
    if (stream || document.hidden) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 4032 }, height: { ideal: 3024 } }
      });
      $('video').srcObject = stream;
      await $('video').play().catch(() => {});
    } catch (e) {
      stream = null;
      say('Câmera ao vivo bloqueada — use 📁 Câmera iPhone (ou permita a câmera).', '#fbbf24');
    }
  }
  function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  $('btn-flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; stopCam(); startCam(); };

  // ---------- carimbo (mesmo layout do Timemark; medidas tiradas de uma foto 1512x2016) ----------
  const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MESES = ['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
  const FONT_BASE = {{ url_for('static', filename='fonts/')|tojson }};
  const FONTS = [['CamBold','cam-bold'],['CamReg','cam-reg'],['CamLight','cam-light'],['CamCond','cam-cond']];
  const fontsReady = Promise.all(FONTS.map(([fam, file]) => {
    try { const ff = new FontFace(fam, 'url(' + FONT_BASE + file + '.woff?v=2)'); document.fonts.add(ff); return ff.load().catch(() => null); }
    catch (e) { return null; }
  }));
  const F = (fam, px) => px.toFixed(1) + 'px ' + fam + ', Roboto, -apple-system, system-ui, sans-serif';
  function fmtCoord(v, p_, n_) { return Math.abs(v).toFixed(6) + '°' + (v >= 0 ? p_ : n_); }
  function wrap(ctx, text, maxW) {
    const parts = String(text).split(/(\s+)/).filter(w => w !== '');
    const lines = []; let cur = '';
    for (const w of parts) {
      const t = cur + w;
      if (ctx.measureText(t.trim()).width > maxW && cur.trim()) { lines.push(cur.trim()); cur = w.trim() ? w : ''; }
      else cur = t;
    }
    if (cur.trim()) lines.push(cur.trim());
    // palavra única maior que a linha: quebra por caractere
    const out = [];
    for (const l of lines) {
      if (ctx.measureText(l).width <= maxW) { out.push(l); continue; }
      let c = '';
      for (const ch of l) { if (ctx.measureText(c + ch).width > maxW && c) { out.push(c); c = ch; } else c += ch; }
      if (c) out.push(c);
    }
    return out;
  }
  function verifyCode() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'; let s = '';
    const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(16)) : Array.from({length: 16}, () => Math.random() * 256);
    for (let i = 0; i < 16; i++) s += A[r[i] % A.length];
    return s;
  }
  function stamp(src, sw, sh) {
    const MAX = 2400;
    const k = Math.min(1, MAX / Math.max(sw, sh));
    const W = Math.round(sw * k), H = Math.round(sh * k);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.drawImage(src, 0, 0, W, H);

    const u = Math.min(W, H) / 1512;              // 1 unidade = 1 px numa foto 1512 de largura
    const now = new Date();
    const hh = now.getHours(), mi = String(now.getMinutes()).padStart(2, '0');
    const hm = ((hh % 12) || 12) + ':' + mi, ap = hh < 12 ? 'AM' : 'PM';
    const off = -now.getTimezoneOffset() / 60;
    const dateStr = DIAS[now.getDay()] + ', ' + now.getDate() + ' ' + MESES[now.getMonth()] + ' ' + now.getFullYear() + ' GMT' + (off >= 0 ? '+' : '') + off;

    const X = 64 * u;                              // início do texto
    const maxW = W - X - 60 * u;
    const BOLD = 62 * u, REG = 45 * u, BSTEP = 73 * u, RSTEP = 82 * u;

    ctx.font = F('CamBold', BOLD);
    const bold = [];
    wrap(ctx, 'MAP: ' + target.map, maxW).forEach(l => bold.push(l));
    wrap(ctx, 'DEVICE: ' + target.device, maxW).forEach(l => bold.push(l));
    const fus = $('fus').value.trim();
    if (fus !== '' && !isNaN(parseInt(fus, 10))) bold.push(String(parseInt(fus, 10)));
    ctx.font = F('CamReg', REG);
    const reg = [dateStr];
    if (addr) wrap(ctx, addr, maxW).forEach(l => reg.push(l));
    if (pos) reg.push(fmtCoord(pos.lat, 'N', 'S') + ', ' + fmtCoord(pos.lng, 'E', 'W'));

    // posições de baixo para cima
    const lastRegBase = H - 50 * u;
    const regBase = reg.map((_, i) => lastRegBase - (reg.length - 1 - i) * RSTEP);
    const lastBoldBase = regBase[0] - 91 * u;
    const boldBase = bold.map((_, i) => lastBoldBase - (bold.length - 1 - i) * BSTEP);
    const capTop = boldBase[0] - 44 * u;

    const shadow = (on) => {
      ctx.shadowColor = on ? 'rgba(0,0,0,0.38)' : 'transparent';
      ctx.shadowBlur = on ? 4 * u : 0; ctx.shadowOffsetX = on ? 1 * u : 0; ctx.shadowOffsetY = on ? 1 * u : 0;
    };

    // caixa da hora
    const boxH = 128 * u, boxBottom = capTop - 41 * u, boxTop = boxBottom - boxH, boxX = 28 * u;
    ctx.font = F('CamLight', 108 * u);
    const SX = 0.65, PSX = 0.9;                     // dígitos estreitos como no Timemark
    const tW = ctx.measureText(hm).width * SX;
    ctx.font = F('CamCond', 46 * u);
    const pmX = X + tW + 29 * u, pmW = ctx.measureText(ap).width * PSX;
    const cx = pmX + pmW + 75 * u, cy = boxTop + 64.5 * u, r = 37 * u;
    const boxW = cx + 68 * u - boxX;
    shadow(false);
    ctx.fillStyle = 'rgba(57,26,18,0.97)';
    roundRect(ctx, boxX, boxTop, boxW, boxH, 12 * u); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
    ctx.save(); ctx.translate(X, boxTop + 102 * u); ctx.scale(SX, 1);
    ctx.font = F('CamLight', 108 * u); ctx.fillText(hm, 0, 0); ctx.restore();
    ctx.save(); ctx.translate(pmX, boxTop + 56 * u); ctx.scale(PSX, 1);
    ctx.font = F('CamCond', 46 * u); ctx.fillText(ap, 0, 0); ctx.restore();
    ctx.fillStyle = '#fdb200'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#603411'; ctx.lineWidth = 7 * u; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 15 * u, cy + 1 * u); ctx.lineTo(cx - 4 * u, cy + 12 * u); ctx.lineTo(cx + 16 * u, cy - 10 * u); ctx.stroke();

    // barra amarela
    ctx.fillStyle = '#fdb100';
    ctx.fillRect(28 * u, capTop - 1 * u, 6 * u, (lastRegBase + 3 * u) - (capTop - 1 * u));

    // textos
    shadow(true); ctx.fillStyle = '#fff';
    ctx.font = F('CamBold', BOLD);
    bold.forEach((l, i) => ctx.fillText(l, X, boldBase[i]));
    ctx.font = F('CamReg', REG);
    reg.forEach((l, i) => ctx.fillText(l, X, regBase[i]));

    // canto inferior direito
    ctx.textAlign = 'right';
    ctx.font = F('CamReg', 34 * u); ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText('Photo by', W - 27 * u, H - 86 * u);
    ctx.font = F('CamBold', 50 * u);
    const wCer = ctx.measureText('CER').width;
    ctx.fillStyle = '#fff'; ctx.fillText('CER', W - 27 * u, H - 33 * u);
    ctx.fillStyle = '#f4e444'; ctx.fillText('SPLI', W - 27 * u - wCer, H - 33 * u);
    ctx.textAlign = 'left';

    // texto vertical na direita
    ctx.save();
    ctx.translate(W - 22 * u, H * 0.59); ctx.rotate(-Math.PI / 2);
    ctx.font = F('CamReg', 28 * u); ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText('© ' + verifyCode() + '   SPLICER Verified', 0, 0);
    ctx.restore();
    shadow(false);

    const p2 = (n) => String(n).padStart(2, '0');
    const clean = (s) => String(s || '').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    const name = now.getFullYear() + p2(now.getMonth() + 1) + p2(now.getDate()) + '_' + p2(hh) + p2(now.getMinutes()) + p2(now.getSeconds())
      + '_' + clean((addr || '').split(',')[0]) + '_MAP_' + clean(target.map) + '_DEVICE_' + clean(target.device).slice(0, 60) + '.jpg';
    return { canvas: c, name };
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---------- fotos guardadas no celular: só envia depois de "Lançar" ----------
  // Guarda os bytes (ArrayBuffer) e não Blob: o Safari do iPhone falha ao enviar Blob lido do IndexedDB.
  let dbp = null;
  function idb() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('splicer-cam', 2);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('q')) r.result.createObjectStore('q', { keyPath: 'id', autoIncrement: true }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function qAdd(item) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('q', 'readwrite'); const rq = t.objectStore('q').add(item); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
  async function qPut(item) { const d = await idb(); return new Promise((res) => { const t = d.transaction('q', 'readwrite'); t.objectStore('q').put(item); t.oncomplete = () => res(); }); }
  async function qDel(id) { const d = await idb(); return new Promise((res) => { const t = d.transaction('q', 'readwrite'); t.objectStore('q').delete(id); t.oncomplete = () => res(); }); }
  async function qAll() { const d = await idb(); return new Promise((res) => { const t = d.transaction('q', 'readonly'); const rq = t.objectStore('q').getAll(); rq.onsuccess = () => res(rq.result || []); }); }
  const bytesOf = async (it) => { if (it.buf) return it.buf; try { return it.blob ? await it.blob.arrayBuffer() : null; } catch (e) { return null; } };

  // confirmação na tela
  function ask(html, okTxt) {
    return new Promise((res) => {
      const o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:18px';
      o.innerHTML = '<div style="background:#111827;border:1px solid #374151;border-radius:16px;max-width:420px;width:100%;padding:18px;font-size:16px;line-height:1.45">' + html +
        '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">' +
        '<div class="btn" data-r="0" style="padding:10px 14px;font-size:15px">Cancelar</div>' +
        '<div class="btn g" data-r="1" style="padding:10px 14px;font-size:15px">' + okTxt + '</div></div></div>';
      o.addEventListener('click', (e) => { const r = e.target.getAttribute && e.target.getAttribute('data-r'); if (r === '0' || r === '1') { o.remove(); res(r === '1'); } });
      document.body.appendChild(o);
    });
  }

  let sending = false;
  async function refreshBar() {
    const items = await qAll();
    const wait = items.filter((x) => !x.approved), go = items.filter((x) => x.approved);
    $('btn-launch').style.display = wait.length ? '' : 'none';
    $('btn-launch').textContent = '🚀 Lançar (' + wait.length + ')';
    $('btn-save').style.display = items.length || savedBlobs.length ? '' : 'none';
    if (go.length && !sending) say('Enviando ' + go.length + ' foto(s)…', '#93c5fd');
  }
  async function flush() {
    if (sending) return; sending = true;
    try {
      const items = (await qAll()).filter((x) => x.approved);
      for (const it of items) {
        const buf = await bytesOf(it);
        if (!buf) { await qDel(it.id); continue; }
        const fd = new FormData();
        fd.append('record_id', it.record_id);
        fd.append('photo', new Blob([buf], { type: 'image/jpeg' }), it.name);
        let d = null, r = null;
        try {
          r = await fetch(BASE + '/upload', { method: 'POST', body: fd });
          d = await r.json().catch(() => null);
        } catch (e) {
          say('Sem sinal — as fotos ficam guardadas e enviam sozinhas depois.', '#fbbf24');
          break;
        }
        if (!r.ok && r.status >= 500) { say(((d && d.error) || ('Servidor ocupado (' + r.status + ')')) + ' — tento de novo em instantes.', '#fbbf24'); break; }
        await qDel(it.id);
        markThumb(it.tid || ('q' + it.id), r.ok && d && d.ok !== false ? '✓' : '⚠️');
        say(r.ok ? resultText(d, it.device) : ('⚠️ ' + ((d && d.error) || ('Erro ' + r.status))), r.ok ? '#4ade80' : '#f87171');
        poll();
      }
    } finally { sending = false; refreshBar(); }
  }
  function resultText(d, dev) {
    if (!d) return 'Enviada: ' + dev;
    if (d.duplicate) return 'Foto repetida, já estava em ' + dev;
    const a = d.action;
    if (a === 'test' || a === 'test1577') return '✓ Teste lançado em ' + dev + (d.power_dbm != null ? ' (' + d.power_dbm + ' dBm)' : '');
    if (a === 'placed') return '✓ Subida registrada em ' + dev;
    if (a === 'saved') return '✓ Foto salva em ' + dev + (d.note ? ' — ' + d.note : '');
    if (d.ok === false) return '⚠️ ' + (d.error || 'Erro');
    return '✓ Lançado em ' + dev + (d.splices != null ? ' · ' + d.splices + ' fusões' : '');
  }
  setInterval(flush, 15000);
  window.addEventListener('online', flush);

  // Lançar: pergunta antes e manda tudo para a IA lançar
  $('btn-launch').onclick = async () => {
    const wait = (await qAll()).filter((x) => !x.approved);
    if (!wait.length) return;
    const byDev = {};
    wait.forEach((x) => { byDev[x.device] = (byDev[x.device] || 0) + 1; });
    let h = '<b>Lançar ' + wait.length + ' foto(s)?</b><br><br>';
    Object.entries(byDev).forEach(([dv, n]) => { h += '📦 <b>' + dv.replace(/</g, '&lt;') + '</b>: ' + n + ' foto(s)<br>'; });
    h += '<br><span style="color:#9ca3af;font-size:14px">A IA lê as fotos e lança como no Foto Auto (fusões, teste ou subida).</span>';
    if (!(await ask(h, '🚀 Sim, lançar'))) return;
    for (const x of wait) { x.approved = true; await qPut(x); }
    refreshBar(); flush();
  };

  let tidSeq = 0;
  function addThumbFrom(src, w, h, tid) {
    const t = document.createElement('canvas'); const k = 64 / h;
    t.width = Math.round(w * k); t.height = 64;
    t.getContext('2d').drawImage(src, 0, 0, t.width, t.height);
    const div = document.createElement('div'); div.className = 'th'; div.id = tid;
    div.innerHTML = '<img src="' + t.toDataURL('image/jpeg', 0.7) + '"><span>⏳</span>';
    $('thumbs').prepend(div);
    // tocar na miniatura: apagar a foto antes de lançar
    div.onclick = async () => {
      const items = await qAll(); const it = items.find((x) => (x.tid || ('q' + x.id)) === tid);
      if (!it || it.approved) return;
      if (await ask('<b>Apagar esta foto?</b><br><span style="color:#9ca3af;font-size:14px">Ela ainda não foi lançada.</span>', '🗑️ Apagar')) {
        await qDel(it.id); div.remove(); refreshBar();
      }
    };
  }
  function markThumb(tid, s) { const el = tid && document.getElementById(tid); if (el) el.querySelector('span').textContent = s; }
  function say(t, color) { $('msg').textContent = t; $('msg').style.color = color || '#fff'; }

  const savedBlobs = [];   // fotos desta sessão para "Salvar na galeria"
  async function finish(src, w, h) {
    if (!target) return;
    await fontsReady;
    const { canvas, name } = stamp(src, w, h);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    lastBlob = blob; lastName = name;
    savedBlobs.push({ blob, name });
    const tid = 't' + Date.now() + '_' + (++tidSeq);
    addThumbFrom(canvas, canvas.width, canvas.height, tid);
    const buf = await blob.arrayBuffer();
    await qAdd({ record_id: target.record_id, device: target.device, name, buf, tid, at: Date.now(), approved: false });
    say('Foto guardada. Tire as outras e toque em 🚀 Lançar.', '#fde68a');
    refreshBar();
  }
  // ao abrir: mostra as fotos que ficaram guardadas
  async function restore() {
    for (const it of await qAll()) {
      const buf = await bytesOf(it); if (!buf) continue;
      try {
        const bmp = await createImageBitmap(new Blob([buf], { type: 'image/jpeg' }));
        addThumbFrom(bmp, bmp.width, bmp.height, it.tid || ('q' + it.id));
        if (it.approved) markThumb(it.tid || ('q' + it.id), '⏫');
      } catch (e) {}
    }
    refreshBar();
  }

  // tirar foto pela câmera ao vivo
  $('shoot').onclick = async () => {
    if (!target) return;
    const v = $('video');
    $('flash').style.opacity = 0.8; setTimeout(() => $('flash').style.opacity = 0, 120);
    if (stream && v.videoWidth) {
      await finish(v, v.videoWidth, v.videoHeight);
    } else {
      $('file').click();
    }
  };
  // câmera nativa do iPhone (qualidade máxima)
  $('btn-native').onclick = () => { if (target) $('file').click(); };
  $('file').onchange = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const img = new Image();
    img.onload = () => { finish(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(f);
  };
  // salvar na galeria (folha de compartilhar do iPhone → Salvar Imagem)
  $('btn-save').onclick = async () => {
    let list = savedBlobs.slice();
    if (!list.length) {
      for (const it of await qAll()) { const b = await bytesOf(it); if (b) list.push({ blob: new Blob([b], { type: 'image/jpeg' }), name: it.name }); }
    }
    if (!list.length) return;
    const files = list.map((x) => new File([x.blob], x.name, { type: 'image/jpeg' }));
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); } catch (e) {}
    } else {
      files.forEach((f) => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); });
    }
  };

  poll(); startGps(); startCam(); restore().then(flush);
})();
</script>
</body>
</html>
